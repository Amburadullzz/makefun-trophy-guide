<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Ledger — GTA VI trophy guide &amp; tracker</title>
<meta name="description" content="An offline guide and progress tracker for all 55 PlayStation 5 trophies of Grand Theft Auto VI.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="src/styles/base.css">
<link rel="stylesheet" href="src/styles/layout.css">
<link rel="stylesheet" href="src/styles/components.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="#tracker" aria-label="Leonida Ledger, home">
      <img class="brand-mark" src="icon.svg" alt="" width="34" height="34">
      <span class="brand-text">
        <span class="brand-name">Leonida Ledger</span>
        <span class="brand-tag">GTA VI · PS5 trophy guide &amp; tracker</span>
      </span>
    </a>

    <nav class="tabs" id="tabs" aria-label="Views">
      <button class="tab" type="button" data-view="tracker" aria-selected="true">Tracker</button>
      <button class="tab" type="button" data-view="roadmap" aria-selected="false">Roadmap</button>
      <button class="tab" type="button" data-view="missables" aria-selected="false">Missables</button>
    </nav>

    <div class="topbar-meter" id="topbar-meter" aria-live="polite"></div>
  </header>

  <main class="workspace" id="workspace">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="stage" id="stage" aria-live="polite"></section>
    <aside class="inspector" id="inspector" aria-label="Trophy guide"></aside>
  </main>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
